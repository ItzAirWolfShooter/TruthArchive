<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TruthArchive</title>
    <style>
      body {
        background-color: black;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      a {
        color: white;
        font-size: 48px;
        text-decoration: none;
      }

      /* Hidden text slightly brighter than black */
      .hidden-message {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 24px;
        color: #010101; /* 1% brighter than black */
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div>
      <a href="https://youtu.be/HsM_VmN6ytk?list=RDHsM_VmN6ytk">
        You shouldn't be here
      </a>
    </div>

    <div class="hidden-message">Beware of the color Yellow</div>
  </body>
</html>
