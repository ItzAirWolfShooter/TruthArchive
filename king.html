<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        background-color: black;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        font-family: "Times New Roman", Times, serif;
        text-align: center;
      }
      input {
        padding: 10px;
        margin: 5px;
        width: 250px;
        border-radius: 5px;
        border: none;
      }
      button {
        padding: 10px 20px;
        margin-top: 10px;
        cursor: pointer;
      }
      #msg {
        margin-top: 20px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h2>Login</h2>

    <input id="user" type="text" placeholder="Username" />
    <input id="pass" type="password" placeholder="Password" />

    <button onclick="login()">Submit</button>

    <div id="msg"></div>

    <script src="login.js"></script>
  </body>
</html>
